name: wukong-ecommerce-local

configs:
  minio-tls-caddy:
    content: |
      {
        admin off
      }
      https://localhost:9012 {
        tls internal
        @signed_get_head {
          method HEAD
          query x-id=GetObject
        }
        handle @signed_get_head {
          reverse_proxy http://minio:9000 {
            method GET
          }
        }
        handle {
          reverse_proxy http://minio:9000
        }
      }

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wukong
      POSTGRES_PASSWORD: wukong
      POSTGRES_DB: wukong
    ports: ["54329:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wukong"]
      interval: 2s
      timeout: 2s
      retries: 20
  minio:
    # The former quay.io community image now rejects anonymous CI pulls.
    # Pin Chainguard's public MinIO build by digest so registry changes do not
    # silently alter the test service or break an unrelated PR.
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: wukong
      MINIO_ROOT_PASSWORD: wukong-secret
      MINIO_API_CORS_ALLOW_ORIGIN: http://127.0.0.1:49217
    ports: ["9010:9000", "9011:9001"]
  minio-tls:
    image: caddy:2-alpine
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile"]
    configs:
      - source: minio-tls-caddy
        target: /etc/caddy/Caddyfile
    depends_on: [minio]
    ports: ["9012:9012"]
    volumes: ["./.wrangler/caddy-data:/data"]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1026:1025", "8026:8025"]
