services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wukong
      POSTGRES_PASSWORD: wukong
      POSTGRES_DB: wukong
    ports: ["54329:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wukong"]
      interval: 2s
      timeout: 2s
      retries: 20
  redis:
    image: redis:8-alpine
    ports: ["6389:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: wukong
      MINIO_ROOT_PASSWORD: wukong-secret
      MINIO_API_CORS_ALLOW_ORIGIN: http://127.0.0.1:49217
    ports: ["9010:9000", "9011:9001"]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1026:1025", "8026:8025"]
