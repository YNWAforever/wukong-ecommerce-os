name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wukong
          POSTGRES_PASSWORD: wukong
          POSTGRES_DB: wukong
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U wukong -d wukong"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      DATABASE_URL: postgres://wukong_app:wukong-app-local@localhost:54329/wukong
      DATABASE_ADMIN_URL: postgres://wukong:wukong@localhost:54329/wukong
      TEST_DATABASE_URL: postgres://wukong_app:wukong-app-local@localhost:54329/wukong
      TEST_DATABASE_ADMIN_URL: postgres://wukong:wukong@localhost:54329/wukong
      S3_BUCKET: wukong-ci
      S3_ENDPOINT: http://127.0.0.1:9010
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: wukong
      S3_SECRET_ACCESS_KEY: wukong-secret
      S3_FORCE_PATH_STYLE: "true"
      AI_PROVIDER: fake
      SHOPLINE_ADAPTER: mock
      RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start local object storage and mail sink
        run: docker compose up -d --force-recreate minio minio-tls mailpit
      - name: Check runtime formatting
        run: pnpm format:runtime:check
      - name: Prove legacy runtimes are absent
        run: pnpm runtime:forbidden:check
      - name: Render and validate Cloudflare configuration
        env:
          CLOUDFLARE_ENV: preview
          CLOUDFLARE_HYPERDRIVE_ID: 00000000000000000000000000000000
          BUILD_SHA: ${{ github.sha }}
          AI_PROVIDER: fake
          OPENAI_LISTING_MODEL: gpt-5-mini
          S3_BUCKET: wukong-opak-preview-assets
          S3_ENDPOINT: https://ci.r2.cloudflarestorage.com
          S3_REGION: auto
          S3_FORCE_PATH_STYLE: "false"
        run: |
          node scripts/render-cloudflare-config.mjs
          unset CLOUDFLARE_ENV
          pnpm --filter @wukong/worker types
          node --test tests/ci-workflow.test.mjs tests/cloudflare-config.test.mjs
      - name: Prepare database runtime role
        run: |
          PGPASSWORD=wukong psql "$DATABASE_ADMIN_URL" -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'wukong_app') THEN CREATE ROLE wukong_app LOGIN PASSWORD 'wukong-app-local' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS; END IF; END \$\$;"
      - name: Build
        run: pnpm --filter @wukong/db... build
      - name: Apply migrations
        run: pnpm --filter @wukong/db db:migrate
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Integration tests
        run: pnpm test:integration
      - name: Production build
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright Wrangler Queue acceptance (fake AI/mock SHOPLINE)
        env:
          PLAYWRIGHT_E2E: "1"
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgres://wukong_app:wukong-app-local@127.0.0.1:54329/wukong
        run: pnpm exec playwright test --project=chromium --workers=1 --reporter=line
      - name: Verify the completed Opak audit by draft
        run: |
          DRAFT_ID="$(cat test-results/real-stack-draft-id.txt)"
          test -n "$DRAFT_ID"
          pnpm --filter @wukong/db audit:verify --workspace ws_opak --draft "$DRAFT_ID"
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
