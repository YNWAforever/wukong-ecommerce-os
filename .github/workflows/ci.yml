name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wukong
          POSTGRES_PASSWORD: wukong
          POSTGRES_DB: wukong
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U wukong -d wukong"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6389:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      DATABASE_URL: postgres://wukong_app:wukong-app-local@localhost:54329/wukong
      DATABASE_ADMIN_URL: postgres://wukong:wukong@localhost:54329/wukong
      TEST_DATABASE_URL: postgres://wukong_app:wukong-app-local@localhost:54329/wukong
      TEST_DATABASE_ADMIN_URL: postgres://wukong:wukong@localhost:54329/wukong
      REDIS_URL: redis://localhost:6389
      TEST_REDIS_URL: redis://localhost:6389
      S3_BUCKET: wukong-ci
      AI_PROVIDER: fake
      SHOPLINE_ADAPTER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare database runtime role
        run: |
          PGPASSWORD=wukong psql "$DATABASE_ADMIN_URL" -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'wukong_app') THEN CREATE ROLE wukong_app LOGIN PASSWORD 'wukong-app-local' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS; END IF; END \$\$;"
      - name: Apply migrations
        run: pnpm --filter @wukong/db db:migrate
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Integration tests
        run: pnpm test:integration
      - name: Build
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright pilot (fake AI/mock SHOPLINE)
        env:
          PLAYWRIGHT_E2E: "1"
        run: pnpm test:e2e
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
